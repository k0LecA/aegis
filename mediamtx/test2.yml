  - url: stun:127.0.0.1:8190

paths:
  test:
    runOnInit: ffmpeg
      -re
      -stream_loop -1
      -i test.mp4
      -c:v copy
      -bsf:v h264_mp4toannexb
      -c:a aac
      -b:a 128k
      -ar 44100
      -f rtsp
      -rtsp_transport tcp
      rtsp://localhost:8555/test
    runOnInitRestart: yes